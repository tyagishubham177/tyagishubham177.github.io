<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Set the stored preference before a cross-document animation can start.
      try {
        document.documentElement.dataset.motionState = sessionStorage.getItem('portfolio-motion') === 'off' || matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'on';
      } catch { document.documentElement.dataset.motionState = 'off'; }
    </script>
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Shubham Tyagi's product portfolio: healthcare workflows, enterprise platforms, and practical AI explorations." />
    <meta property="og:type" content="website" />
    <title>Shubham Tyagi — Product Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
